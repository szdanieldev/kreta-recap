  <ellipse rx="168" ry="65" transform="rotate(41) translate(0 5)" fill="none" stroke="#062f2b" stroke-width="26"/>
  <ellipse rx="168" ry="65" transform="rotate(41)" fill="none" stroke="url(#ring2)" stroke-width="23"/>
  <g transform="rotate(-12)">
