 <g font-family="Liberation Sans,Arial,sans-serif">
  <circle cx="68" cy="65" r="4" fill="#54efd0"/>
  <text x="85" y="69" font-size="11" fill="#a4beb1" letter-spacing="2.8">A TE TANÉVED. A TE KARAKTERED.</text>
  <text x="60" y="204" font-size="99" font-weight="700" fill="#f0f1e5" letter-spacing="-6">jegyem<tspan fill="#54efd0" font-weight="400">.</tspan></text>
  <text x="65" y="265" font-size="29" fill="#e9efe1" letter-spacing="-.5">Te melyik sulis karakter vagy?</text>
  <path d="M65 310h44" stroke="#54efd0" stroke-width="3"/>
  <text x="65" y="361" font-size="12" fill="#92aea2" letter-spacing="1.8">JEGYEK. PILLANATOK. EGYETLEN TÖRTÉNET.</text>
  <text x="65" y="420" font-size="9" fill="#718d82" letter-spacing="2">JEGYEM</text>
  <text x="1214" y="420" text-anchor="end" font-size="9" fill="#718d82" letter-spacing="2">TANÉV → STORY</text>
 </g>
 <ellipse cx="1003" cy="364" rx="150" ry="20" fill="#000" opacity=".25" filter="url(#shadow)"/>
