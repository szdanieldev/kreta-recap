<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="title desc">
<title id="title">Jegyem — Te melyik sulis karakter vagy?</title><desc id="desc">Mélyzöld alapon türkiz tipográfia és egy ötös köré fonódó térbeli gyűrűk.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#061c1d"/><stop offset="1" stop-color="#0a3e3d"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#39e5bd" stop-opacity=".18"/><stop offset="1" stop-color="#39e5bd" stop-opacity="0"/></radialGradient>
 <linearGradient id="ring" x1=".12" y1="0" x2=".9" y2="1"><stop stop-color="#baffea"/><stop offset=".26" stop-color="#55efd0"/><stop offset=".65" stop-color="#20ae9a"/><stop offset="1" stop-color="#0d655e"/></linearGradient>
 <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#178879"/><stop offset=".42" stop-color="#45dec0"/><stop offset=".75" stop-color="#b8ffe9"/><stop offset="1" stop-color="#268b7d"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="11"/></filter>
 <clipPath id="frame"><rect width="1280" height="460" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)">
 <path fill="url(#bg)" d="M0 0h1280v460H0z"/>
 <circle cx="1025" cy="235" r="315" fill="url(#glow)"/>
